tasks:
- nvmeof:
    installer: host.a
    gw_image: quay.io/ceph/nvmeof:devel # "default" is the image cephadm defaults to; change to test specific nvmeof images, example "latest"
    rbd:
      pool_name: mypool
      image_name_prefix: myimage
    gateway_config:
      subsystems_count: 16
      namespaces_count: 4 # each subsystem
      cli_image: quay.io/ceph/nvmeof-cli:devel

- cephadm.wait_for_service:
    service: nvmeof.mypool.mygroup0

- cephadm.exec:
    host.a:
      - ceph orch ls nvmeof --export > /tmp/nvmeof-orig.yaml
      - cp /tmp/nvmeof-orig.yaml /tmp/nvmeof-dsa.yaml 
      - "sed -i '/  pool: mypool/a\\  enable_dsa_acceleration: true' /tmp/nvmeof-dsa.yaml"
      - cat /tmp/nvmeof-dsa.yaml
      - ceph orch ls
      - ceph orch apply -i /tmp/nvmeof-dsa.yaml
      - ceph orch redeploy nvmeof.mypool.mygroup0
      
- cephadm.wait_for_service:
    service: nvmeof.mypool.mygroup0

- workunit:
    no_coverage_and_limits: true
    clients:
      client.0:
        - nvmeof/setup_subsystem.sh
        - nvmeof/basic_tests.sh
    env:
      RBD_POOL: mypool
      RBD_IMAGE_PREFIX: myimage
