tasks:
- nvmeof:
    installer: host.a
    gw_image: default # "default" is the image cephadm defaults to; change to test specific nvmeof images, example "latest"
    rbd:
      pool_name: mypool
      image_name_prefix: myimage
    gateway_config:
      subsystems_count: 10 
      namespaces_count: 90 # each subsystem
      cli_image: quay.io/ceph/nvmeof-cli:devel

- cephadm.wait_for_service:
    service: nvmeof.mypool.mygroup0
    refresh: True

- exec:
    host.a:
      - ceph orch ls nvmeof --export > /tmp/nvmeof-orig.yaml
      - cp /tmp/nvmeof-orig.yaml /tmp/nvmeof-no-huge-page.yaml 
      - "sed -i '/  pool: mypool/a\\  spdk_mem_size: 8192' /tmp/nvmeof-no-huge-page.yaml"
      - cat /tmp/nvmeof-no-huge-page.yaml
      - ceph orch ls
      - ceph orch apply -i /tmp/nvmeof-no-huge-page.yaml
      # TEMPORARY: redeploy each gateway daemon one-by-one instead of
      # `ceph orch redeploy <service>`, which cephadm staggers ~1 gw / 10 min and
      # makes spec changes take too long to reach every gateway.
      - "for d in $(ceph orch ps --service-name nvmeof.mypool.mygroup0 --format json | jq -r '.[].daemon_name'); do ceph orch daemon redeploy $d; sleep 60; done"
      
- cephadm.wait_for_service:
    service: nvmeof.mypool.mygroup0
    refresh: True

- workunit:
    no_coverage_and_limits: true
    clients:
      client.0:
        - nvmeof/setup_subsystem.sh
        - nvmeof/basic_tests.sh
    env:
      RBD_POOL: mypool
      RBD_IMAGE_PREFIX: myimage
      NVMEOF_NATIVE_CLI: 'true'
