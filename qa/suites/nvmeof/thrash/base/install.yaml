use_shaman: True
tasks:
- install:
    tag: v21.1.2
    extra_packages:
        - nvme-cli
- cephadm:
    image: quay.io/ceph/ceph:v21.1.2
- cephadm.shell:
    host.a:
    # https://tracker.ceph.com/issues/75452
    # prevent CEPHADM_REFRESH_FAILED from frequent device cache timeouts
    - ceph config set mgr mgr/cephadm/device_cache_timeout 86400
    # get state before nvmeof deployment
    - ceph orch status
    - ceph orch ps
    - ceph orch host ls
    - ceph orch device ls
    - ceph osd lspools
