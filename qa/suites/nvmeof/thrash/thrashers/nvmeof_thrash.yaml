overrides:
  ceph:
    log-ignorelist:  
      - OSD_DOWN
      - OSD_HOST_DOWN
      - OSD_ROOT_DOWN
      # nvmeof daemon thrashing
      - CEPHADM_FAILED_DAEMON
      - NVMEOF_SINGLE_GATEWAY
      - NVMEOF_GATEWAY_DOWN
      - are in unavailable state
      - is unavailable
      - is in error state
      - failed cephadm daemon

tasks:
- nvmeof.thrash:
    seed: 1744120051
    checker_host: 'client.0'
    randomize: False
