use_shaman: True
tasks:
- install:
    extra_packages:
        - nvme-cli
- cephadm:
    image: quay.ceph.io/ceph-ci/ceph:main
- cephadm.shell:
    host.a:
    # get state before nvmeof deployment
    - ceph orch status
    - ceph orch ps
    - ceph orch host ls
    - ceph orch device ls
    - ceph osd lspools
