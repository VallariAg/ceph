# runs on default nvmeof image (i.e. DEFAULT_NVMEOF_IMAGE)
tasks:
- nvmeof:
    installer: host.a
    gw_image: quay.io/vallari/nvmeof:1.5.3 # "default" is the image cephadm defaults to; change to test specific nvmeof images, example "latest"
    rbd:
      pool_name: mypool
      image_name_prefix: myimage
    gateway_config:
      subsystems_count: 1
      namespaces_count: 8
      cli_image: quay.io/vallari/nvmeof-cli:1.5.3

- cephadm.wait_for_service:
    service: nvmeof.mypool.mygroup0

- workunit:
    no_coverage_and_limits: true
    clients:
      client.0:
        - nvmeof/setup_subsystem.sh
    env:
      RBD_POOL: mypool
      RBD_IMAGE_PREFIX: myimage

- workunit:
    no_coverage_and_limits: true
    timeout: 30m
    clients:
      client.0:
        - nvmeof/basic_tests.sh
        - nvmeof/fio_test.sh --random_devices 4
    env:
      RBD_POOL: mypool
      IOSTAT_INTERVAL: '10'
      RUNTIME: '600'
